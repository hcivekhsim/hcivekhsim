name: Update Terminal Stats Card

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Checkout generator
        uses: actions/checkout@v4
        with:
          repository: yogeshwaran01/github-stats-terminal-style
          path: tool

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write config
        run: |
          cat > tool/.github-stats-config.json << 'EOF'
          {
            "sourceType": "user",
            "target": "hcivekhsim",
            "theme": "monokai",
            "headerStyle": "windows",
            "hostname": "github.com",
            "typingSpeed": 80,
            "commands": ["neofetch", "languages", "uptime", "exit"]
          }
          EOF

      - name: Generate SVG
        working-directory: tool
        env:
          GHT: ${{ secrets.GHT }}
        run: |
          npm install
          npx ts-node bin/github-stats-terminal.ts --user hcivekhsim

      - name: Move SVG to assets
        run: |
          mkdir -p assets
          SVG=$(find tool -maxdepth 2 -name "github_stats.svg" | head -n 1)
          echo "Found: $SVG"
          cp "$SVG" assets/github_stats.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github_stats.svg
          git diff --staged --quiet || (git commit -m "chore: update terminal stats card [skip ci]" && git push)